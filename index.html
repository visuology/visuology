<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeroen Lavèn</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <img src="jeroen.jpg" alt="Photo of Jeroen Laven" class="photo" onclick="playSoundAndAnimate()">
        <div class="content">
            <h1 style="font-family: 'SFCompactRounded'; font-size: 1.3em">Jeroen Lavèn</h1>
            <p>👷🏻‍♂️ Community Relations & Operations Manager, <a href="https://www.kunstinstituutmelly.nl" target="_blank"> Melly</a>
            <br>💚 Connector & Chair, <a href="https://www.rdamsenieuwe.nl" target="_blank">R'damse Nieuwe</a>
            <br>🏙️ Board Member, <a href="https://www.dekunstavond.nl" target="_blank">Kunstblock</a>
            <br>📍 Rotterdam, the Netherlands
            <br>💌 <a href="mailto:mai@visuology.nl" target="_blank">Email me!</a> 
            <br>🔗 <a href="https://www.instagram.com/visuology_nl" target="_blank">Instagram</a> / <a href="https://www.linkedin.com/in/visuology/" target="_blank">LinkedIn</a></p>
        </div>
          <audio id="mySound" src="sound.mp3"></audio>
          <div class="wave" style="width: 100px; height: 100px;"></div>
          <div class="wave" style="width: 100px; height: 100px;"></div>
          <div class="wave" style="width: 100px; height: 100px;"></div>
      </div>
      <script>
          function playSoundAndAnimate() {
              var sound = document.getElementById("mySound");
              var waves = document.querySelectorAll('.wave');
              var img = document.querySelector('.photo');
              var rect = img.getBoundingClientRect();
              var centerX = rect.left + rect.width / 2;
              var centerY = rect.top + rect.height / 2;
      
              sound.play();
      
              waves.forEach(function(wave, index) {
                  // Immediately remove any existing animation
                  wave.style.animation = 'none';
                  
                  // Reposition the wave before reanimating
                  wave.style.left = (centerX - rect.width / 2) + 'px';
                  wave.style.top = (centerY - rect.height / 2) + 'px';
      
                  // Use setTimeout to reapply the animation
                  setTimeout(function() {
                      wave.style.animation = `waveAnimation 7s ease-out ${index * 0.5}s forwards`;
                  }, 50); // slight delay to ensure the reset is registered
              });
          }
      </script>
</body>
</html>
